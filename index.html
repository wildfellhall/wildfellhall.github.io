<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeeadf" />
    <meta name="description" content="A quiet writing room. An antique ivory desk, a little light, and space for things to come." />
    <title>Wildfell Hall</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="room" aria-label="An antique white wooden writing desk">
      <div id="desk-fallback" aria-hidden="true">
        <picture>
          <source media="(min-aspect-ratio: 3/2)" srcset="./materials/desk-still-wide.webp?v=crest-3" />
          <source media="(max-aspect-ratio: 3/4)" srcset="./materials/desk-still-portrait.webp?v=crest-3" />
          <img src="./materials/desk-still.webp?v=crest-3" alt="" fetchpriority="high" />
        </picture>
      </div>
      <h1 class="sr-only">Wildfell Hall</h1>
      <canvas id="desk" aria-describedby="desk-help" aria-label="An elevated view of an antique ivory writing desk, with visible wood grain, carved drawers, porcelain and brass knobs, cabriole legs, a brass oval crest with embossed gold script, roses and leaves, and a light pink floral carpet"></canvas>
      <p id="desk-help" class="sr-only">Scroll, pinch, or use the plus and minus keys to zoom. Drag or use the arrow keys to inspect the desk. Press Home or use Reset view to return to the starting view. Click or tap a drawer to open or close it, or Tab to its knob and press Enter or Space.</p>
      <div id="drawer-controls" role="group" aria-label="Desk drawers" hidden>
        <button class="drawer-hotspot" aria-label="Open left drawer" aria-expanded="false"></button>
        <button class="drawer-hotspot" aria-label="Open centre drawer" aria-expanded="false"></button>
        <button class="drawer-hotspot" aria-label="Open right drawer" aria-expanded="false"></button>
      </div>
      <div class="room-vignette" aria-hidden="true"></div>
        <div class="desk-controls" role="group" aria-label="Desk view and lighting" hidden>
          <canvas id="control-frame" aria-hidden="true"></canvas>
          <button id="light-toggle" aria-label="Change to evening light" aria-pressed="false">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <circle class="icon-wash" cx="16" cy="16" r="5.2"/>
              <circle cx="16" cy="16" r="5.2"/><circle class="icon-detail" cx="16" cy="16" r="3.7"/>
              <path d="M16 2.5c-1.5 2 .9 3.8 0 6M16 29.5c1.5-2-.9-3.8 0-6M2.5 16c2 1.5 3.8-.9 6 0M29.5 16c-2-1.5-3.8.9-6 0M6.5 6.5c.4 2.5 3.3 2.2 4.2 4.2M25.5 25.5c-.4-2.5-3.3-2.2-4.2-4.2M6.5 25.5c2.5-.4 2.2-3.3 4.2-4.2M25.5 6.5c-2.5.4-2.2 3.3-4.2 4.2"/>
              <path class="icon-detail" d="m11 3.8 1.5 4.3m8.5-4.3-1.5 4.3M3.8 11l4.3 1.5M3.8 21l4.3-1.5M28.2 11l-4.3 1.5m4.3 8.5-4.3-1.5M11 28.2l1.5-4.3m8.5 4.3-1.5-4.3M13.2 17.8l1.3 1.2m.3-2.4 2.4 2.4m.1-2.1 1.5 1.3"/>
            </svg>
          </button>
          <span class="control-divider" aria-hidden="true"></span>
          <button id="view-toggle" aria-label="Look closer at the desk" aria-pressed="false">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <path class="icon-wash" d="M2.5 16Q16 2.5 29.5 16Q16 29.5 2.5 16Z"/>
              <path d="M2.5 16Q16 2.5 29.5 16Q16 29.5 2.5 16ZM4 12.5Q16 3.5 28 12.5"/>
              <circle cx="16" cy="16" r="5.1"/><circle cx="16" cy="16" r="2" fill="currentColor"/>
              <path class="icon-detail" d="m16 11.7 0 1.5m0 5.6v1.5m-4.3-4.3h1.5m5.6 0h1.5m-7.3-3 1 1m4 4 1 1m0-6-1 1m-4 4-1 1M7 19.7l-1 1.4m4-0.1-.7 1.5m13-1.5.7 1.5m2.5-2.8 1 1.4M16 4V2.5m-5 2.6-.7-1.4m10.7 1.4.7-1.4"/>
            </svg>
          </button>
          <span class="control-divider" aria-hidden="true"></span>
          <button id="zoom-out" aria-label="Zoom out" disabled>
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <circle class="icon-wash" cx="12.5" cy="12.5" r="8.4"/>
              <circle cx="12.5" cy="12.5" r="8.4"/><circle class="icon-detail" cx="12.5" cy="12.5" r="6.5"/>
              <path d="m18.5 18.5 2.2 2.2m-.8.8 1.6-1.6m-.8 2.4 1.6-1.6M21.7 22.2c.5 2.4 3.6 3.2 3.8 5.1.6 1.6 3.4-.2 2-1.6-1.8-.7-2.5-3.1-4.7-4.9ZM9 12.5h7"/>
              <path class="icon-detail" d="M7.5 10.1q.9-2 3-2.6m13.1 16.1 2.6 2.6"/>
            </svg>
          </button>
          <button id="zoom-in" aria-label="Zoom in">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <circle class="icon-wash" cx="12.5" cy="12.5" r="8.4"/>
              <circle cx="12.5" cy="12.5" r="8.4"/><circle class="icon-detail" cx="12.5" cy="12.5" r="6.5"/>
              <path d="m18.5 18.5 2.2 2.2m-.8.8 1.6-1.6m-.8 2.4 1.6-1.6M21.7 22.2c.5 2.4 3.6 3.2 3.8 5.1.6 1.6 3.4-.2 2-1.6-1.8-.7-2.5-3.1-4.7-4.9ZM9 12.5h7m-3.5-3.5v7"/>
              <path class="icon-detail" d="M7.5 10.1q.9-2 3-2.6m13.1 16.1 2.6 2.6"/>
            </svg>
          </button>
          <button id="view-reset" aria-label="Reset view">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
              <path d="M8 9.1a10.5 10.5 0 1 1-2.4 10M8 9.1l-.2-6.4M8 9.1l6.3-1.3"/>
              <path class="icon-detail" d="M11 7.2a8.7 8.7 0 1 1-2.9 13.1M8.1 5l2.4 1.2m.2 2.5L12 6.3"/>
              <path d="M5.6 19.1c-2.1 1.1-2.4 4.6.8 5.1 2.5.4 4-1.9 2.3-3.1-.9-.6-1.9 0-1.7.9"/>
              <path class="icon-wash" d="M8 9.1 7.8 4.6 12.7 8.2Z"/>
            </svg>
          </button>
        </div>
      <p id="render-status" class="sr-only" role="status" aria-live="polite">Preparing the writing room.</p>
      <noscript><p class="sr-only">A still version of the writing desk. Enable JavaScript for lighting, zoom, and opening drawers.</p></noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
